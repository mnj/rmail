[package]
name = "rmail_bench"
version = "0.8.11"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "time"] }
tokio-rustls = { version = "0.23", features = ["dangerous_configuration"] }
rustls-pemfile = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
