[package]
name = "rmail_outbound"
version = "1.0.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
chrono = "0.4"
rmail_common = { path = "../common" }
rmail_queue_manager = { path = "../queue-manager" }
tracing = "0.1"
trust-dns-resolver = { version = "0.22", features = ["tokio"] }
openssl = "0.10"
hex = "0.4"
serde_json = "1.0"
once_cell = "1.19"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio-openssl = "0.6"
hickory-resolver = "0.26"
base64 = "0.21"

[dev-dependencies]
tempfile = "3.5"
