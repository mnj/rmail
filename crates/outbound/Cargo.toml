[package]
name = "rmail_outbound"
version = "0.8.4"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
rmail_common = { path = "../common" }
rmail_queue_manager = { path = "../queue-manager" }
tracing = "0.1"
trust-dns-resolver = { version = "0.22", features = ["tokio"] }
tokio-native-tls = "0.3"
native-tls = "0.2"
openssl = "0.10"
hex = "0.4"
serde_json = "1.0"
