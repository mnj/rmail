[package]
name = "rmail_web"
version = "0.8.7"
edition = "2024"

[dependencies]
# Minimal tokio-based HTTP server (no hyper/axum to avoid feature conflicts in this environment)
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
rmail_common = { path = "../common" }
base64 = "0.21"

[dev-dependencies]
tempfile = "3.5"
