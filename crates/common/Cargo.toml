[package]
name = "rmail_common"
version = "0.8.11"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
toml = "0.7"
anyhow = "1.0"
argon2 = "0.4"
password-hash = "0.4"
rand = "0.8"
serde_json = "1.0"
rusqlite = { version = "0.29", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.22"
moka = { version = "0.12", features = ["sync"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# SCRAM helpers
pbkdf2 = "0.11"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.21"
unicode-normalization = "0.1"
idna = "1.1"

# DNS / mail auth helpers
mail-auth = { version = "0.11", default-features = false, features = ["arc", "rust-crypto", "dns-hickory"] }
trust-dns-resolver = "0.22"
once_cell = "1.21"
rustls-pki-types = { version = "1", features = ["std"] }
libc = "0.2"
socket2 = "0.6"

[dev-dependencies]
tempfile = "3.5"
