[package]
name = "rmail_common"
version = "1.0.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
toml = "0.7"
anyhow = "1.0"
argon2 = "0.4"
password-hash = "0.4"
rand = "0.8"
serde_json = "1.0"
rusqlite = { version = "0.29", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.22"
moka = { version = "0.12", features = ["sync", "future"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
bytes = "1"
# HTTP serving for the admin console and webmail.
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "json", "query"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
tower-http = { version = "0.6", features = ["limit", "timeout"] }

# SCRAM helpers
pbkdf2 = "0.11"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.21"
flate2 = "1"
encoding_rs = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
unicode-normalization = "0.1"
stringprep = "0.1"
idna = "1.1"

# DNS / mail auth helpers
mail-auth = { version = "0.11", default-features = false, features = ["arc", "rust-crypto", "dns-hickory"] }
trust-dns-resolver = "0.22"
once_cell = "1.21"
rustls-pki-types = { version = "1", features = ["std"] }
libc = "0.2"
socket2 = "0.6"
tokio-rustls = "0.23"
rustls-pemfile = "1.0"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
# ACME (RFC 8555) certificate management
instant-acme = { version = "0.8", default-features = false, features = ["ring", "hyper-rustls", "rcgen", "x509-parser", "time"] }
x509-parser = { version = "0.18", default-features = false }
time = "0.3"

[features]
# Accept "plain:<password>" hashes. Test fixtures only; never enable in release builds.
insecure-plaintext-passwords = []
# Helpers for other crates' tests, e.g. a generated localhost certificate.
test-support = []

[dev-dependencies]
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
tempfile = "3.5"
tokio = { version = "1", features = ["test-util"] }
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "mail_storage"
harness = false

[[bench]]
name = "queue_publication"
harness = false
