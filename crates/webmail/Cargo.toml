[package]
name = "rmail_webmail"
version = "1.0.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
base64 = "0.21"
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "json", "query"] }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
rmail_common = { path = "../common" }

[dev-dependencies]
rmail_common = { path = "../common", features = ["insecure-plaintext-passwords"] }
tempfile = "3.5"
tower = { version = "0.5", features = ["util"] }
