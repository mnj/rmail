[package]
name = "rmail_webmail"
version = "0.8.7"
edition = "2024"

[dependencies]
anyhow = "1.0"
base64 = "0.21"
hmac = "0.12"
percent-encoding = "2.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
rmail_common = { path = "../common" }

[dev-dependencies]
tempfile = "3.5"
