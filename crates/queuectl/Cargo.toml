[package]
name = "rmail_queuectl"
version = "0.8.11"
edition = "2024"

[dependencies]
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
rmail_common = { path = "../common" }
rmail_queue_manager = { path = "../queue-manager" }
serde_json = "1.0"
