[package]
name = "rmail_smtpd"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
rmail_common = { path = "../common" }
tracing = "0.1"
base64 = "0.21"
once_cell = "1.20"
rand = "0.8"

# TLS dependencies (implicit SMTPS and future STARTTLS)
tokio-rustls = "0.23"
rustls = "0.21"
rustls-pemfile = "1.0"
sha2 = "0.10"
