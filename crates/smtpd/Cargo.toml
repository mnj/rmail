[package]
name = "rmail_smtpd"
version = "0.8.11"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
rmail_common = { path = "../common" }
tracing = "0.1"
base64 = "0.21"
once_cell = "1.20"
rand = "0.8"

# TLS dependencies (implicit SMTPS and future STARTTLS)
tokio-rustls = { version = "0.23", features = ["dangerous_configuration"] }
rustls = "0.21"
rustls-pemfile = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
tempfile = "3.5"
hmac = "0.12"
pbkdf2 = "0.12"
sha2 = "0.10"
