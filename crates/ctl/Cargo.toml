[package]
name = "rmail_ctl"
version = "1.0.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
rmail_common = { path = "../common" }
rmail_queuectl = { path = "../queuectl" }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
toml = "0.7"
argon2 = "0.4"
password-hash = "0.4"
rand = "0.8"
anyhow = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
tempfile = "3.5"
