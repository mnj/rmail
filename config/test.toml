# Test config for running rMail services on non-privileged ports
[global]
mail_root = "mail_test"
listen_addrs = ["127.0.0.1:2525", "[::1]:2525"]
smtps_port = 2465
submission_port = 2587
imaps_port = 1993
imap_port = 1143
web_port = 18080
tls_cert = "config/certs/localhost.crt"
tls_key = "config/certs/localhost.key"
log_level = "debug"
# optional web admin user for local testing
web_admin_user = "admin"
web_admin_password_hash = "plain:password"
# local test DB path for mailboxes/catchalls
db_path = "config/rmail_test.db"
# ACME challenge dir for local testing (empty by default)
acme_challenge_dir = "config/acme-challenges"

