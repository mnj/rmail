# rMail configuration file.
#
# The file only says where rMail keeps its data. Everything else (listeners,
# TLS, authentication, limits, filtering, ...) is stored in the database and
# edited on the admin console's Settings page or with `rmail_ctl settings`:
#
#   rmail_ctl settings list
#   rmail_ctl settings set global.hostname mail.example.com
#   rmail_ctl settings set global.listeners.smtp '["[::]:25"]'
#   rmail_ctl settings set global.tls_cert /etc/rmail/tls/fullchain.pem
#
# Other keys in this file are ignored, with a warning in the service logs.
[global]
# Mailboxes, queues and indexes.
mail_root = "/opt/rmail/mail"
# The SQLite database with mailboxes, routing, DKIM keys and settings.
db_path = "/opt/rmail/config/rmail.db"
