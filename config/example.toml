# Example rMail configuration (TOML)
[global]
mail_root = "mail"
# Set this to a long random value in production.
# webmail_session_secret = "replace-with-at-least-32-random-bytes"
tls_cert = "config/certs/localhost.crt"
tls_key = "config/certs/localhost.key"
log_level = "info"
# optional web admin user (for /stats and /logs endpoints)
web_admin_user = "admin"
# generate a hash using rmail_ctl hash and paste here
web_admin_password_hash = "argon2$PLACEHOLDER"
# optional SQLite DB for mailboxes and catchalls (preferred for production)
db_path = "config/rmail.db"
# directory used to serve ACME http-01 challenges (used by automated cert managers)
acme_challenge_dir = "config/acme-challenges"

[global.tls]
minimum_version = "1.2"
# Empty uses Rustls safe defaults. To pin suites, use Rustls names such as:
# cipher_suites = ["TLS13_AES_256_GCM_SHA384", "TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384"]
cipher_suites = []
# Optional DER OCSP response produced by the certificate issuer/ACME client.
# It is loaded and swapped atomically with the certificate on SIGHUP.
# ocsp_response = "/etc/rmail/tls/ocsp.der"
# Set true when a reverse proxy terminates HTTPS for both web services.
web_http_only = false

[global.tcp_listener]
# SO_REUSEADDR is always enabled for clean restarts. Enable reuse_port only
# when intentionally running multiple processes on the same sockets.
reuse_port = false
backlog = 1024
# false makes each [::]:port wildcard below accept both IPv6 and IPv4.
ipv6_only = false

[global.listeners]
# Address lists may bind exact interfaces independently, for example:
#   IPv4 only: smtp = ["192.0.2.10:25"]
#   IPv6 only: smtp = ["[2001:db8::10]:25"]
#   Separate IPv4+IPv6 sockets: set ipv6_only=true and list both addresses.
# The active example uses one wildcard dual-stack socket.
smtp = ["[::]:25"]
# LMTP is local-only and disabled by default. Bind loopback or a private address.
lmtp = []
submission = ["[::]:587"]
smtps = ["[::]:465"]
imap = ["[::]:143"]
imaps = ["[::]:993"]
admin = ["127.0.0.1:8080"]
webmail = ["127.0.0.1:8081"]

[global.tracking]
# Durable protocol/message history used by `rmail_ctl watch` and `track`.
retention_days = 30
max_events = 2000000
prune_interval_seconds = 3600
prune_batch_size = 10000

[security]
# Resource-exhaustion controls shared by SMTP, SMTPS, and submission listeners.
smtp_max_concurrent_sessions = 1000
smtp_max_connections_per_minute = 60
smtp_max_commands_per_minute = 120
smtp_max_recipients = 100
submission_max_recipients = 50
submission_max_messages_per_minute = 30
# Require the authenticated mailbox in every visible From address.
submission_require_from_alignment = false
# PLAIN and LOGIN are advertised only over TLS. SCRAM-SHA-256 remains available pre-TLS.
imap_sasl_mechanisms = ["PLAIN", "LOGIN", "SCRAM-SHA-256", "SCRAM-SHA-256-PLUS"]
smtp_sasl_mechanisms = ["PLAIN", "LOGIN", "SCRAM-SHA-256"]
scanner_failure_action = "tempfail" # tempfail | accept | reject
scanner_timeout_ms = 5000
scanner_max_message_bytes = 10485760
clamav_enabled = false
clamav_endpoint = "unix:/run/clamav/clamd.ctl" # or tcp:127.0.0.1:3310
rspamd_enabled = false
rspamd_url = "http://127.0.0.1:11333/checkv2"
rspamd_quarantine_actions = ["add header", "rewrite subject", "reject"]
rspamd_reject_actions = []

# Experimental: enable DANE/TLSA verification for outbound deliveries via environment variable
# RMAIL_ENABLE_DANE=1  (set to 0 or false to disable)
