# Example rMail configuration (TOML)
#
# With `db_path` set, this file only needs `mail_root` and `db_path`. On the
# first start every other value below is imported once into the settings
# database; from then on settings are edited in the admin console (Settings
# page) or with `rmail_ctl settings`, and values left here are ignored (a
# warning lists any that differ from the database).
[global]
mail_root = "mail"
# Fully qualified name announced in the SMTP/LMTP greeting, EHLO/HELO and
# Received headers. Defaults to the system hostname.
# hostname = "mail.example.com"
# Optional: when unset, a random webmail session key is generated and kept in
# the settings database.
# webmail_session_secret = "replace-with-at-least-32-random-bytes"
tls_cert = "config/certs/localhost.crt"
tls_key = "config/certs/localhost.key"
log_level = "info"
# Admin console credentials. Prefer `rmail_ctl admin-password`, which stores
# them in the settings database. Without credentials the console only starts
# on loopback addresses, where the first visitor creates the admin account.
# web_admin_user = "admin"
# web_admin_password_hash = "$argon2id$..."   # from `rmail_ctl hash`
# optional SQLite DB for mailboxes and catchalls (preferred for production)
db_path = "config/rmail.db"

[global.tls]
minimum_version = "1.2"
# Empty uses Rustls safe defaults. To pin suites, use Rustls names such as:
# cipher_suites = ["TLS13_AES_256_GCM_SHA384", "TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384"]
cipher_suites = []
# Optional DER OCSP response produced by the certificate issuer/ACME client.
# It is loaded and swapped atomically with the certificate on SIGHUP.
# ocsp_response = "/etc/rmail/tls/ocsp.der"
# Set true when a reverse proxy terminates HTTPS for both web services.
web_http_only = false

[global.tcp_listener]
# SO_REUSEADDR is always enabled for clean restarts. Enable reuse_port only
# when intentionally running multiple processes on the same sockets.
reuse_port = false
backlog = 1024
# false makes each [::]:port wildcard below accept both IPv6 and IPv4.
ipv6_only = false

[global.listeners]
# Address lists may bind exact interfaces independently, for example:
#   IPv4 only: smtp = ["192.0.2.10:25"]
#   IPv6 only: smtp = ["[2001:db8::10]:25"]
#   Separate IPv4+IPv6 sockets: set ipv6_only=true and list both addresses.
# The active example uses one wildcard dual-stack socket.
smtp = ["[::]:25"]
# LMTP is local-only and disabled by default. Bind loopback or a private address.
lmtp = []
submission = ["[::]:587"]
smtps = ["[::]:465"]
imap = ["[::]:143"]
imaps = ["[::]:993"]
admin = ["127.0.0.1:8080"]
webmail = ["127.0.0.1:8081"]
# Plain HTTP (port 80), served by rmail_web: answers ACME http-01 challenges and
# redirects everything else to HTTPS (see global.http_redirect_url).
# http = ["[::]:80"]

[global.tracking]
# Durable protocol/message history used by `rmail_ctl watch` and `track`.
retention_days = 30
max_events = 2000000
prune_interval_seconds = 3600
prune_batch_size = 10000

[security]
# Resource-exhaustion controls for IMAP/IMAPS and SMTP-family listeners.
imap_max_concurrent_sessions = 1000
imap_max_connections_per_minute = 60
imap_max_commands_per_minute = 300
smtp_max_concurrent_sessions = 1000
smtp_max_connections_per_minute = 60
smtp_max_commands_per_minute = 120
smtp_max_recipients = 100
submission_max_recipients = 50
submission_max_messages_per_minute = 30
# Require the authenticated mailbox in every visible From address.
submission_require_from_alignment = false
# PLAIN and LOGIN are advertised only over TLS. SCRAM-SHA-256 remains available pre-TLS.
imap_sasl_mechanisms = ["PLAIN", "LOGIN", "SCRAM-SHA-256", "SCRAM-SHA-256-PLUS"]
smtp_sasl_mechanisms = ["PLAIN", "LOGIN", "SCRAM-SHA-256", "SCRAM-SHA-256-PLUS"]
scanner_failure_action = "tempfail" # tempfail | accept | reject
scanner_timeout_ms = 5000
scanner_max_message_bytes = 10485760
clamav_enabled = false
clamav_endpoint = "unix:/run/clamav/clamd.ctl" # or tcp:127.0.0.1:3310
rspamd_enabled = false
rspamd_url = "http://127.0.0.1:11333/checkv2"
rspamd_quarantine_actions = ["add header", "rewrite subject", "reject"]
rspamd_reject_actions = []

# Required before adding OAUTHBEARER or XOAUTH2 to either SASL mechanism list.
# Tokens are POSTed to an RFC 7662 endpoint and are never compared with mailbox passwords.
# [security.oauth]
# introspection_url = "https://identity.example.test/oauth2/introspect"
# client_id = "rmail"
# client_secret = "replace-with-secret"
# required_scopes = ["mail"]
# identity_claim = "email" # username | sub | email
# issuer = "https://identity.example.test/"
# audience = "rmail"
# timeout_ms = 5000
# allow_insecure_http = false

# Automatic certificates from Let's Encrypt (or another ACME CA). Usually managed
# on the admin console's Certificates page. The certificate is written to
# tls_cert/tls_key (or <mail_root>/tls/ when unset); every TLS service reloads it
# when the files change, and rmail_web renews it before it expires.
# [acme]
# enabled = true
# domains = ["mail.example.com"]    # empty uses global.hostname
# email = "postmaster@example.com"
# ca = "letsencrypt"                # letsencrypt | letsencrypt-staging | zerossl | custom
# challenge = "http-01"             # http-01 needs listeners.http on port 80; or dns-01
# [acme.dns]                        # for challenge = "dns-01"
# provider = "cloudflare"           # cloudflare | digitalocean | desec | gandi | route53 | rfc2136
# api_token = "..."                 # Cloudflare token with Zone:Read + DNS:Edit
# rfc2136_server = "ns1.example.com"
# tsig_key_name = "acme-key."
# tsig_secret = "base64..."
# tsig_algorithm = "hmac-sha256"

# Folder suggestions from local models (rmail_classifier). Usually managed on the
# admin console's Organization page; model files live in <mail_root>/models.
# [classifier]
# enabled = false
# embed_model = "bge-small-en-v1.5-q8_0.gguf"
# chat_model = ""               # optional fallback for uncertain messages
# threads = 0                   # 0 uses every CPU
# poll_interval_seconds = 15
# backfill_per_folder = 300
# max_input_bytes = 2048
# knn_confidence = 60           # percent
# autofile_confidence = 85      # percent
# min_examples = 5

# Experimental: enable DANE/TLSA verification for outbound deliveries via environment variable
# RMAIL_ENABLE_DANE=1  (set to 0 or false to disable)

# Rules applied when the admin console password is set or changed (console
# or `rmail_ctl admin-password`). Existing passwords are not re-checked.
[security.admin_password_policy]
min_length = 10
max_length = 128
require_lowercase = false
require_uppercase = false
require_digit = false
require_symbol = false
forbid_username = true
